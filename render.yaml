# One-click deploy on Render: a free web service plus a free PostgreSQL database.
# https://render.com/deploy?repo=https://github.com/digvijay165/cafe-website
services:
  - type: web
    name: little-lantern-cafe
    runtime: node
    plan: free
    # NODE_ENV=production would make npm skip the build tools, so include them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: little-lantern-db
          property: connectionString
      # Emails that become admins (staff) when they sign up.
      - key: STAFF_EMAILS
        sync: false
      # Optional: https://resend.com key for real emails. Without it, links appear in the Render logs.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: little-lantern-db
    plan: free
    databaseName: cafe
    user: cafe
