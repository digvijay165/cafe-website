  <text x="88" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#2b211b">Slow coffee, warm bakes,</text>
  <text x="88" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#2b211b">ordered ahead.</text>
  <text x="88" y="346" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#7c6e63">Menu · opening hours · location · online pickup ordering · staff dashboard</text>

