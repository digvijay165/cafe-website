      <stop offset="0" stop-color="#fbf3e7"/>
      <stop offset="1" stop-color="#f1dcc0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6c77a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f6c77a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
