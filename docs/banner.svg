<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Little Lantern Café</title>
  <desc id="desc">Menu, opening hours and online pickup ordering for a neighbourhood café</desc>
  <defs>
