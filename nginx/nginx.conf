# Reverse proxy in front of the Node app. Add TLS (e.g. certbot) before going live; the app sends
# Secure cookies and HSTS when NODE_ENV=production, so it must be served over HTTPS.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  client_max_body_size 64k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build files never change, so let NGINX and browsers cache them hard.
  location /assets/ {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
